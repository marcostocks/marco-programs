[package]
name = "marco-vault"
version = "0.1.0"
description = "Marco IPO Subscription Vaults — on-chain vault for HK IPO access via USDC"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "marco_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
